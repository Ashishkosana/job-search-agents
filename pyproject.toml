[project]
name = "job-search-agents"
version = "0.1.0"
description = "Job-search agents and a freshness-gated sourcing pipeline"
requires-python = ">=3.9"
dependencies = []                      # standard library only, on purpose

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["fresh", "discover_boards"]

[tool.setuptools.package-dir]
"" = "pipeline"

[tool.ruff]
line-length = 96
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["pipeline", "tests"]
